[project]
name = "warden-api"
version = "0.1.0"
description = "Warden (Compliance CI Gate) - compliance intelligence layer for CI/CD pipelines"
requires-python = ">=3.12"
readme = "../../README.md"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<2.0",
    "python-hcl2>=4.3,<6.0",
    "networkx>=3.3,<4.0",
    "httpx>=0.27,<1.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.4,<0.15",
    "mypy>=1.10,<2.0",
]
postgres = ["psycopg[binary]>=3.1,<4.0"]
llm = ["openai>=1.30,<2.0"]
checkov = ["checkov>=3.2"]
all = ["warden-api[postgres,llm]"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "C4"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"../../tests/*" = ["B011"]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py", "app/database.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
